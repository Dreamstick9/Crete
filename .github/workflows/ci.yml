name: CI

# Typecheck, unit tests and a production build on every pull request, so a
# branch that does not compile is caught before anyone opens its preview or
# reviews it by hand.
#
# Deliberately needs no secrets: the build runs with no KV credentials, which
# lib/kv.ts handles by falling back to disk. That keeps this workflow working
# for pull requests opened from forks, where secrets are withheld.

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Secret scanning. Runs on fork PRs too: the only credential it needs is the
  # automatic per-run GITHUB_TOKEN, which is granted to forks as read-only.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2.3: without it the action exits
          # with "GITHUB_TOKEN is now required to scan pull requests" and the
          # job fails before scanning anything. It had been failing that way on
          # every pull request, so this check has never actually run on one --
          # it only ever passed on pushes to main, where the code path differs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
